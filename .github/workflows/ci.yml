name: Verify application and infrastructure
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package:azure
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm run setup:local
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify a real database connection
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/status | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["database"]["state"] == "connected", d'
      - name: Verify database has no published host port
        run: test -z "$(docker compose port database 5432 2>/dev/null || true)"
      - name: Verify application role privileges
        run: |
          role_flags=$(docker compose exec -T database psql -U local_operator -d sentinellab -tA -c "SELECT rolsuper, rolcreatedb, rolcreaterole, rolreplication FROM pg_roles WHERE rolname='sentinel_app'")
          role_grants=$(docker compose exec -T database psql -U local_operator -d sentinellab -tA -c "SELECT has_database_privilege('sentinel_app','sentinellab','CONNECT'), has_database_privilege('sentinel_app','sentinellab','TEMP'), has_schema_privilege('sentinel_app','public','CREATE')")
          test "$role_flags" = 'f|f|f|f'
          test "$role_grants" = 't|f|f'
      - if: always()
        run: docker compose down -v
